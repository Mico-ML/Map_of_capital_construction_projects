# nginx reverse-proxy для web (§3, §11): раздача SPA + проксирование /api и /media на api.
# Все запросы к 2ГИС идут через api (бэкенд-прокси) — из браузера наружу только MapGL.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # безопасность (базовые заголовки; CSP ослаблен для MapGL/2ГИС — уточнить на этапе 4)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → контейнер api (docker-сеть)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # медиа (фото/рендеры/снимки) → api раздаёт статику с тома
    location /media/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # демонстрационные медиа «До/В процессе/После» → api (read-only из репозитория)
    location /mock-media/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public";
    }

    # статика с длинным кэшем (хэшированные имена)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
